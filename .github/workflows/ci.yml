name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: workbridge
          POSTGRES_PASSWORD: workbridge_test
          POSTGRES_DB: workbridge_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U workbridge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://workbridge:workbridge_test@localhost:5433/workbridge_test?schema=public
      JWT_ACCESS_SECRET: ci_access_secret_123456789012345678901234
      JWT_REFRESH_SECRET: ci_refresh_secret_12345678901234567890123
      CORS_ORIGIN: http://localhost:5173
      OTP_EXPIRES_MINUTES: "10"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npx prisma generate

      - run: npm test