services:
  db:
    image: postgres:16-alpine
    container_name: workbridge-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: workbridge
      POSTGRES_PASSWORD: workbridge_dev
      POSTGRES_DB: workbridge
    ports:
      - "5432:5432"
    volumes:
      - workbridge_data:/var/lib/postgresql/data

volumes:
  workbridge_data: